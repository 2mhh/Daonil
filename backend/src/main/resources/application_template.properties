spring.application.name=daonil

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:daonil}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- 환경변수로 설정하는 값 (실제 값은 저장소에 넣지 않는다) ---
# DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD : DB 접속 (비밀번호는 필수)
# 외부 서비스 키
openai.api.key=${OPENAI_API_KEY:}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy}
# 아래 3개는 기본값이 있어 로컬에서는 생략 가능: APP_CORS_ALLOWED_ORIGINS, APP_FRONTEND_URL, APP_UPLOAD_DIR
