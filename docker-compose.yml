# 한 대의 서버(VM)에 MySQL + 백엔드 + 프론트(nginx)를 함께 올린다.
# 사용법: .env.example 을 .env 로 복사해 값을 채운 뒤  docker compose up -d --build
# (상세 절차와 점검 방법: docs/DEPLOY.md)
services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: daonil
    volumes:
      - mysql_data:/var/lib/mysql
      # 데이터 볼륨이 비어 있는 최초 기동 때 1회만 실행된다 (이미 있으면 건너뜀)
      - ./mysql_code/daonil_schema.sql:/docker-entrypoint-initdb.d/01-daonil-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # DB 포트는 외부에 열지 않는다 (ports 없음)

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # --- DB (application.properties 는 이미지에 없으므로 환경변수로 받는다) ---
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/daonil?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      # --- 주소·경로: 배포 환경마다 달라지는 값 (어긋나면 화면은 뜨는데 데이터가 안 오는 문제가 생긴다) ---
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN}   # 브라우저에서 접속하는 프론트 주소
      APP_FRONTEND_URL: ${FRONTEND_ORIGIN}           # 소셜 로그인 후 돌아갈 프론트 주소
      APP_UPLOAD_DIR: /data/uploads/                 # 업로드 파일 저장 폴더 (아래 볼륨에 연결)
      # --- 비밀 값 ---
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 소셜 로그인은 도메인·HTTPS 가 필요해 사용하지 않는다. 앱 시작 실패를 막는 더미 값
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: dummy
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: dummy
      # --- 외부 공고 동기화 (공공데이터 API) ---
      KEAD_API_KEY: ${KEAD_API_KEY:-}
      KEAD_SYNC_ENABLED: ${KEAD_SYNC_ENABLED:-false}              # true: 매일 정해진 시각에 자동 실행
      KEAD_SYNC_CRON: ${KEAD_SYNC_CRON:-0 0 3 * * *}               # 실행 시각 (서울 시간, 기본 매일 03:00)
      KEAD_SYNC_RUN_ON_STARTUP: ${KEAD_SYNC_RUN_ON_STARTUP:-false} # true: 서버가 시작될 때 1회 바로 실행 (처음 데이터를 채울 때)
      APP_JOB_EXPIRY_ENABLED: ${APP_JOB_EXPIRY_ENABLED:-false}
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # 빌드할 때 번들에 박히는 값: 브라우저가 호출할 백엔드 주소
        VITE_API_URL: ${PUBLIC_API_URL}
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  uploads_data:
